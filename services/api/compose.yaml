services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mural
      POSTGRES_USER: mural
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mural -d mural"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://mural:${POSTGRES_PASSWORD}@database:5432/mural
    command: ["node", "dist/src/migrate.js"]
    depends_on:
      database:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://mural:${POSTGRES_PASSWORD}@database:5432/mural
      PUBLIC_ORIGIN: https://${API_DOMAIN:?Set the API domain}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ANDROID_SERVER_CLIENT_ID: ${GOOGLE_ANDROID_SERVER_CLIENT_ID:-}
      GOOGLE_ANDROID_CLIENT_IDS: ${GOOGLE_ANDROID_CLIENT_IDS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_TEST_PRICE_10_USD: ${STRIPE_TEST_PRICE_10_USD:-}
      STRIPE_TEST_PRICE_25_USD: ${STRIPE_TEST_PRICE_25_USD:-}
      STRIPE_TEST_PAYMENT_FEE_10_MINOR: ${STRIPE_TEST_PAYMENT_FEE_10_MINOR:-}
      STRIPE_TEST_PAYMENT_FEE_25_MINOR: ${STRIPE_TEST_PAYMENT_FEE_25_MINOR:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  caddy:
    image: caddy:2-alpine
    environment:
      API_DOMAIN: ${API_DOMAIN}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
